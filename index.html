<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交換生活支出 · Boarding Pass</title>
<style>
:root{--bg:#d6e0ea;--ink:#13233f;--paper:#fffdf7;--mute:#6b7a90;--hi:#f2c230;--bl:#2b59c3}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
[id^=sec]{scroll-margin-top:72px}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
nav{position:sticky;top:0;z-index:9;background:var(--paper);border-bottom:2px solid var(--ink);display:flex;gap:22px;align-items:center;padding:10px 18px;overflow-x:auto;white-space:nowrap}
nav b{margin-right:auto;letter-spacing:.06em}
nav a{position:relative;color:inherit;text-decoration:none;padding:4px 0;font-weight:600}
nav a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--bl);transform:scaleX(0);transform-origin:right;transition:transform .3s}
nav a:hover::after{transform:scaleX(1)}nav a.clicked::after{transform:scaleX(0)}
.wrap{max-width:980px;margin:16px auto;padding:0 16px;display:grid;gap:16px}
.t{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:18px 20px;position:relative}
.t.n::before,.t.n::after{content:"";position:absolute;top:50%;width:22px;height:22px;background:var(--bg);border:2px solid var(--ink);border-radius:50%;margin-top:-11px}
.t.n::before{left:-13px}.t.n::after{right:-13px}
h1{margin:0;font-size:clamp(26px,5vw,40px)}h2{margin:0 0 12px;font-size:17px}
.sub{color:var(--mute);font-size:13px;font-weight:400}
.hero{display:grid;grid-template-columns:1fr auto;gap:0 24px;background:var(--ink);color:#fff}
.big{font-size:clamp(40px,10vw,84px);font-weight:800;line-height:1;margin:12px 0 8px;color:var(--hi);white-space:nowrap}
.dg{display:inline-block;height:1em;overflow:hidden;vertical-align:top}
.st{display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}.st i{display:block;height:1em;font-style:normal}
.meta{display:grid;gap:4px;border-left:2px dashed #ffffff55;padding-left:20px;align-content:center;min-width:150px}
.meta b{font-size:22px;display:block}.meta span{font-size:12px;color:#b9c6da}
.bar{background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 5px,#fff 5px 6px,transparent 6px 10px);height:26px;opacity:.5;margin-top:12px;grid-column:1/-1}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}.ctrl>div{display:flex;gap:8px;flex-wrap:wrap}
.chip,.cat,.tg,.lk{transition:transform .15s}.chip:hover,.cat:hover,.tg:hover,.lk:hover{transform:scale(1.05)}
.chip:active,.cat:active,.tg:active,.lk:active{transform:scale(.94)}
svg .clk{transition:transform .15s;transform-box:fill-box;transform-origin:center;cursor:pointer}
svg .clk:hover{transform:scale(1.08)}svg .clk:active{transform:scale(.93)}svg .mcol{transform-origin:50% 100%}
.seg{transition:stroke-width .15s,opacity .2s;cursor:pointer}.seg:hover,.seg.sel{stroke-width:36}
.chip,.lk{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:3px 14px;font:inherit;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff}.lk{padding:1px 10px;font-size:13px}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.sw{display:flex;align-items:center;gap:10px;font-weight:600}
.tg{width:78px;height:42px;border-radius:999px;border:2px solid var(--ink);background:#fff;position:relative;cursor:pointer;padding:0}
.tg i{position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:50%;background:var(--ink);font-style:normal;line-height:32px;text-align:center;font-size:15px;transition:transform .25s,background .25s}
.tg.on{background:var(--bl)}.tg.on i{transform:translateX(36px);background:#fff}
.pw{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.err{color:#c0392b;font-size:13px}
.g2{display:grid;grid-template-columns:6fr 4fr;gap:24px;align-items:center}
.cat{display:grid;grid-template-columns:14px 1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed #13233f44;padding:7px 4px;cursor:pointer;font:inherit;color:var(--ink)}
.cat.on{background:#f2c23033}.cat.dim{opacity:.35}
.cat i{width:14px;height:14px;border-radius:3px;grid-row:1/3}
.cat .bg{grid-column:2/4;height:5px;background:#13233f14;border-radius:3px}.cat .bg u{display:block;height:100%;border-radius:3px}
.cat small{color:var(--mute)}svg text{font-family:inherit}
#cal{overflow-x:auto}.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);margin-top:8px;align-items:center}
.lg i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid #13233f33}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-weight:600;border-bottom:2px solid var(--ink);padding:6px 4px}
td{padding:6px 4px;border-bottom:1px dashed #13233f33}.r{text-align:right}
input[type=search],input[type=password]{border:2px solid var(--ink);border-radius:999px;padding:7px 14px;font:inherit;background:#fff;width:210px;max-width:100%}
.pay{display:grid;gap:8px}.pay div{display:grid;grid-template-columns:48px 1fr 90px;gap:8px;align-items:center}
.pay u{display:block;height:14px;background:var(--ink);border-radius:3px}.tag{font-size:11px;border:1px solid var(--ink);border-radius:4px;padding:0 4px;margin-left:4px}
@media(max-width:640px){.g2{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.meta{border-left:0;border-top:2px dashed #ffffff55;padding:12px 0 0;margin-top:8px;grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition-duration:0s!important;scroll-behavior:auto!important}}
</style></head><body>
<nav id="nav"><b class="mono">✈ EXCHANGE PASS</b><a href="#sec-top">總覽</a><a href="#sec-cat">錢花哪去了</a><a href="#sec-month">每月航程</a><a href="#sec-day">每日足跡</a><a href="#sec-pay">付款方式</a><a href="#sec-detail">消費明細</a></nav>
<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script>
const ALL=DATA.rows,ENC=DATA.enc,HN=!!(ENC||DATA.meta.hasNotes);let R,MONTHS,CORE;
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('en-US'),sum=a=>a.reduce((s,r)=>s+r.a,0);
const tot={};ALL.forEach(r=>tot[r.c]=(tot[r.c]||0)+r.a);
const CATS=Object.keys(tot).sort((a,b)=>tot[b]-tot[a]);
const PAL=['#2b59c3','#f2c230','#d9483b','#1f9d8a','#7b4fb5','#f08a3c','#13233f','#c2438a','#7f9a2c','#4fa3d9','#8a6a4a'];
const col=c=>PAL[CATS.indexOf(c)%PAL.length];
const LV=['#f9dad0','#f5f2b8','#c5dca0','#a491d3','#818aa3'];
const ml=m=>(m<'2026'?m.slice(2,4)+'年':'')+(+m.slice(5))+'月';
let st={m:'all',c:null,d:null,q:'',notes:false,flight:true,more:40,ask:false,err:false,unlocked:false,fpw:false},prevT=0;
function setup(){R=ALL.filter(r=>st.flight||!r.o);CORE=R.filter(r=>!r.o);MONTHS=[...new Set(R.map(r=>r.d.slice(0,7)))].sort();if(st.m!=='all'&&!MONTHS.includes(st.m))st.m='all'}
setup();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){const e=ENC,km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const ns=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.i)},k,b64(e.c))));ALL.forEach((r,i)=>r.n=ns[i])}
async function doUnlock(){try{await unlock($('#pw').value);st.unlocked=true;st.ask=false;st.err=false;st.notes=true}catch(e){st.err=true;st.fpw=true}render()}
function togNotes(){if(ENC&&!st.unlocked){st.ask=!st.ask;st.fpw=st.ask}else st.notes=!st.notes;render()}
const sw=(on,lab,fn,lock)=>`<div class="sw"><span>${lab}</span><button class="tg ${on?'on':''}" role="switch" aria-checked="${on}" aria-label="${lab}" onclick="${fn}"><i>${lock?'🔒':''}</i></button></div>`;
function arcs(rows){const T=sum(rows)||1,C=2*Math.PI*60;let off=0;const by={};rows.forEach(r=>by[r.c]=(by[r.c]||0)+r.a);
  const s=CATS.filter(c=>by[c]).map(c=>{const l=by[c]/T*C,o=off;off+=l;return `<circle class="seg ${st.c===c?'sel':''}" r="60" cx="90" cy="90" fill="none" stroke="${col(c)}" stroke-width="26" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" opacity="${st.c&&st.c!==c?.3:1}" onclick="pickC('${c}')"><title>${c} ${fmt(by[c])}</title></circle>`}).join('');
  return `<svg viewBox="0 0 180 180" width="100%" style="max-width:360px;display:block;margin:auto" role="img" aria-label="類別占比"><g transform="rotate(-90 90 90)">${s}</g><text x="90" y="86" text-anchor="middle" font-size="10" fill="#6b7a90">${st.c||'全部類別'}</text><text x="90" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#13233f">${fmt(sum(st.c?rows.filter(r=>r.c===st.c):rows))}</text></svg>`}
function stack(rows){const mm=MONTHS.map(m=>{const rs=rows.filter(r=>r.d.startsWith(m)),by={};rs.forEach(r=>by[r.c]=(by[r.c]||0)+r.a);return{m,by,t:sum(rs)}});
  const mx=Math.max(...mm.map(x=>x.t),1),W=560,H=210,bw=W/mm.length;
  return `<svg viewBox="0 0 ${W} ${H+28}" width="100%" role="img" aria-label="月別支出">`+mm.map((x,i)=>{let y=H;const bx=i*bw+bw*.18,w=bw*.64;
    const rs=CATS.filter(c=>x.by[c]).map(c=>{const h=x.by[c]/mx*(H-18);y-=h;return `<rect x="${bx}" y="${y}" width="${w}" height="${h}" fill="${col(c)}" opacity="${st.c&&st.c!==c?.25:1}"><title>${ml(x.m)} ${c} ${fmt(x.by[c])}</title></rect>`}).join('');
    return `<g class="clk mcol" onclick="pickM('${x.m}')">${rs}<text x="${bx+w/2}" y="${y-5}" text-anchor="middle" font-size="11">${fmt(x.t/1000)}k</text><text x="${bx+w/2}" y="${H+18}" text-anchor="middle" font-size="12" font-weight="${st.m===x.m?800:400}">${ml(x.m)}</text></g>`}).join('')+`<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="#13233f" stroke-width="2"/></svg>`}
function cal(rows){const day={};rows.forEach(r=>day[r.d]=(day[r.d]||0)+r.a);
  const v=Object.values(day).sort((a,b)=>a-b),th=[1,2,3,4].map(i=>v[Math.floor(v.length*i/5)]||0),lv=a=>th.filter(t=>a>=t).length;
  const f=new Date(CORE[CORE.length-1].d+'T00:00'),e=new Date(CORE[0].d+'T00:00'),s=new Date(f);s.setDate(s.getDate()-((s.getDay()+6)%7));
  const K=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  let o='',x=0;'一二三四五六日'.split('').forEach((n,i)=>o+=`<text x="0" y="${i*34+42}" font-size="12" fill="#6b7a90">${n}</text>`);
  for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){if(d<f)continue;const k=K(d),i=(d.getDay()+6)%7,w=Math.floor((d-s)/6048e5),a=day[k]||0,X=24+w*34,Y=22+i*34;x=w;
    if(d.getDate()<=7&&i===0||d.getTime()===f.getTime())o+=`<text x="${X}" y="14" font-size="12" font-weight="700">${d.getMonth()+1}月</text>`;
    o+=`<g class="${a?'clk':''}" ${a?`onclick="pickD('${k}')"`:''}><rect x="${X}" y="${Y}" width="30" height="30" rx="7" fill="${a?LV[lv(a)]:'#13233f0d'}" stroke="${st.d===k?'#13233f':'#13233f22'}" stroke-width="${st.d===k?3:1}"><title>${k} ${a?'NT$ '+fmt(a):'無記帳'}</title></rect><text x="${X+15}" y="${Y+20}" text-anchor="middle" font-size="11" fill="${a?'#13233f':'#13233f55'}" pointer-events="none">${d.getDate()}</text></g>`}
  const lab=['< '+fmt(th[0]),fmt(th[0])+'–'+fmt(th[1]),fmt(th[1])+'–'+fmt(th[2]),fmt(th[2])+'–'+fmt(th[3]),'≥ '+fmt(th[3])];
  return `<svg viewBox="0 0 ${24+(x+1)*34} 262" style="width:100%;min-width:620px" role="img" aria-label="每日支出日曆">${o}</svg><div class="lg"><span>每日花費：</span>${LV.map((c,i)=>`<span><i style="background:${c}"></i>${lab[i]}</span>`).join('')}<span><i style="background:#13233f0d"></i>無記帳</span></div>${st.d?`<p style="margin:10px 0 0">已選 <b>${st.d}</b>：NT$ ${fmt(day[st.d]||0)} <a class="lk" href="#sec-detail">看明細 ↓</a> <button class="lk" onclick="pickD(null)">取消選取</button></p>`:`<div class="sub" style="margin-top:6px">點任一有記帳的日期，下方明細會同步顯示</div>`}`}
function roll(T){const el=$('#tot');if(!el)return;const ds=fmt(T).replace(/\D/g,''),od=fmt(prevT).replace(/\D/g,'').padStart(ds.length,'0').slice(-ds.length);let j=0;
  const sp=prevT===T;el.setAttribute('aria-label','NT$ '+fmt(T));
  el.innerHTML='NT$ '+[...fmt(T)].map(ch=>{if(ch===',')return ',';const n=j++;return `<span class="dg"><span class="st" style="transform:translateY(-${(sp?ds[n]:od[n])*10}%)">${'0123456789'.split('').map(x=>`<i>${x}</i>`).join('')}</span></span>`}).join('');
  el.offsetWidth;el.querySelectorAll('.st').forEach((s,n)=>s.style.transform=`translateY(-${ds[n]*10}%)`);prevT=T}
function render(){
  const rM=R.filter(r=>st.m==='all'||r.d.startsWith(st.m)),rC=st.c?rM.filter(r=>r.c===st.c):rM;
  const rT=rC.filter(r=>(!st.d||r.d===st.d)&&(!st.q||(r.c+(st.notes?r.n:'')+r.d).includes(st.q)));
  const T=sum(rC),days=new Set(rC.map(r=>r.d)).size;
  const span=st.m==='all'?Math.round((new Date(CORE[0].d)-new Date(CORE[CORE.length-1].d))/864e5)+1:new Date(+st.m.slice(0,4),+st.m.slice(5),0).getDate();
  const byC={};rM.forEach(r=>byC[r.c]=(byC[r.c]||0)+r.a);const TM=sum(rM)||1,mxC=Math.max(...Object.values(byC));
  const byP={};rC.forEach(r=>byP[r.p]=(byP[r.p]||0)+r.a);const pm=Math.max(...Object.values(byP),1);
  $('#app').innerHTML=`
  <header id="sec-top" class="t hero n"><div><div class="mono" style="color:#b9c6da;font-size:13px">EXCHANGE PASS · TAIWAN ⇄ EUROPE</div>
  <h1>我的交換生活花費</h1><div class="big mono" id="tot"></div><div style="color:#b9c6da">${st.m==='all'?'全期間':ml(st.m)}${st.c?' · '+st.c:''}</div></div>
  <div class="meta"><div><b class="mono">${fmt(T/span)}</b><span>平均每天</span></div><div><b class="mono">${rC.length}</b><span>筆消費</span></div><div><b class="mono">${days}</b><span>天有記帳</span></div></div><div class="bar"></div></header>
  <section class="t"><div class="ctrl"><div><button class="chip ${st.m==='all'?'on':''}" onclick="pickM('all')">全部</button>${MONTHS.map(m=>`<button class="chip ${st.m===m?'on':''}" onclick="pickM('${m}')">${ml(m)}</button>`).join('')}</div>
  ${sw(st.flight,'含來回機票（約32,000）','st.flight=!st.flight;setup();render()')}${HN?sw(st.notes,'顯示備註','togNotes()',ENC&&!st.unlocked):''}</div>
  ${st.ask&&!st.unlocked?`<div class="pw"><input id="pw" type="password" placeholder="輸入解鎖密碼" autocomplete="off" onkeydown="if(event.key==='Enter')doUnlock()"><button class="chip" onclick="doUnlock()">解鎖</button>${st.err?'<span class="err">密碼錯誤</span>':''}</div>`:''}</section>
  <section id="sec-cat" class="t n"><h2>錢花哪去了 <span class="sub">點選類別可篩選整頁</span></h2><div class="g2"><div>${arcs(rM)}</div><div>
  ${CATS.filter(c=>byC[c]).sort((a,b)=>byC[b]-byC[a]).map(c=>`<button class="cat ${st.c===c?'on':''} ${st.c&&st.c!==c?'dim':''}" onclick="pickC('${c}')"><i style="background:${col(c)}"></i><span>${c} <small>${rM.filter(r=>r.c===c).length} 筆</small></span><b class="mono">${fmt(byC[c])} <small>${(byC[c]/TM*100).toFixed(1)}%</small></b><div class="bg"><u style="width:${byC[c]/mxC*100}%;background:${col(c)}"></u></div></button>`).join('')}</div></div></section>
  <section id="sec-month" class="t"><h2>每月航程 <span class="sub">點月份篩選</span></h2>${stack(R.filter(r=>!st.c||r.c===st.c))}</section>
  <section id="sec-day" class="t"><h2>每日足跡 <span class="sub">顏色越深花越多</span></h2><div id="cal">${cal(CORE.filter(r=>!st.c||r.c===st.c))}</div></section>
  <section id="sec-pay" class="t"><h2>付款方式</h2><div class="pay">${Object.entries(byP).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><span>${k}</span><u style="width:${v/pm*100}%"></u><b class="mono r">${fmt(v)}</b></div>`).join('')}</div><div class="sub" style="margin-top:8px">「估」為補記的概估款項</div></section>
  <section id="sec-detail" class="t"><div class="ctrl" style="margin-bottom:8px"><h2 style="margin:0">消費明細${st.d?' · '+st.d:''}</h2>${st.d?'<button class="lk" onclick="pickD(null)">取消日期</button>':''}<input type="search" placeholder="搜尋類別${st.notes?'、備註':''}、日期" value="${esc(st.q)}" oninput="st.q=this.value;st.more=40;render();const i=$('input[type=search]');i.focus();i.setSelectionRange(99,99)"></div>
  <div style="overflow-x:auto"><table><tr><th>日期</th><th>類別</th>${st.notes?'<th>備註</th>':''}<th class="r">金額</th></tr>
  ${rT.slice(0,st.more).map(r=>`<tr><td class="mono">${r.d.slice(5)}</td><td><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${col(r.c)};margin-right:6px"></i>${r.c}</td>${st.notes?`<td>${esc(r.n)}${r.e?'<span class="tag">概估</span>':''}</td>`:''}<td class="r mono">${fmt(r.a)}</td></tr>`).join('')||`<tr><td colspan="4" class="sub">沒有符合的紀錄</td></tr>`}</table></div>
  ${rT.length>st.more?`<p style="text-align:center"><button class="chip" onclick="st.more+=60;render()">再顯示更多（剩 ${rT.length-st.more} 筆）</button></p>`:''}</section>
  <footer class="sub" style="text-align:center;padding-bottom:20px">金額皆為新台幣 · 簽證保險與機票為補記概估</footer>`;
  roll(T);if(st.fpw){const p=$('#pw');p&&p.focus();st.fpw=false}}
function pickM(m){st.m=st.m===m?'all':m;st.d=null;st.more=40;render()}
function pickC(c){st.c=st.c===c?null:c;st.more=40;render()}
function pickD(k){st.d=st.d===k?null:k;if(st.d&&st.m!=='all'&&!st.d.startsWith(st.m))st.m='all';st.more=40;render()}
$('#nav').querySelectorAll('a').forEach(a=>{a.onclick=()=>a.classList.add('clicked');a.onmouseleave=()=>a.classList.remove('clicked')});
render();
</script></body></html>
